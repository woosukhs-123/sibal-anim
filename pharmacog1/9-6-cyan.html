  root.querySelectorAll('[id]').forEach(el => {
    const old = el.id, nu = 's' + i + '-' + old; el.id = nu;
    root.querySelectorAll('[marker-end="url(#' + old + ')"]').forEach(e => e.setAttribute('marker-end', 'url(#' + nu + ')'));
  });
  root.querySelectorAll('defs').forEach(d => { [...d.children].forEach(c => defs.appendChild(document.importNode(c, true))); d.remove(); });
  const items = [], seen = {};
  [...root.children].forEach(el => {
    let k = el.getAttribute('data-k') || ('u:' + el.outerHTML.replace(/url\(#s\d+-/g, 'url(#'));
    if (seen[k]) k += '#' + (seen[k]++); else seen[k] = 1;
    items.push({ k, el: document.importNode(el, true) });
  });
  return { items, map: new Map(items.map(it => [it.k, it])) };
});
const hex = c => { const m = /^#([0-9a-f]{6})$/i.exec(c || ''); return m ? [0, 2, 4].map(j => parseInt(m[1].substr(j, 2), 16)) : null; };
const mixC = (a, b, p) => { const A = hex(a), B = hex(b); if (!A || !B) return p < .5 ? a : b; return '#' + A.map((v, j) => Math.round(v + (B[j] - v) * p).toString(16).padStart(2, '0')).join(''); };
const pts = el => (el.getAttribute('points') || '').trim().split(/\s+/).map(q => q.split(',').map(Number));
const anchor = el => { const t = el.tagName === 'text' ? (el.querySelector('tspan') || el) : el.querySelector('text'); return t ? [parseFloat(t.getAttribute('x')) || 0, parseFloat(t.getAttribute('y')) || 0] : [0, 0]; };
const isText = el => el.tagName === 'text' || (el.tagName === 'g' && el.classList.contains('mtxt'));
const isFlow = el => el.hasAttribute && el.hasAttribute('data-flow');
const pair = (s, k) => (s >= 0 && s < STEPS.length) ? STEPS[s].map.get(k) : null;

// 노드는 (단계, 이름)마다 한 번 복제해 두고 매 프레임 속성만 바꾼다
const CACHE = new Map();
function node(s, it) { const key = s + '|' + it.k; let n = CACHE.get(key); if (!n) { n = it.el.cloneNode(true); n.__base = it.el; CACHE.set(key, n); } return n; }
function reset(n) {   // 원래 속성으로 되돌림
  const b = n.__base;
  for (const a of NUM.concat(['points', 'fill', 'stroke', 'transform', 'stroke-dasharray', 'stroke-dashoffset'])) { if (b.hasAttribute(a)) n.setAttribute(a, b.getAttribute(a)); else n.removeAttribute(a); }
  n.style.opacity = '';
}
function moveText(n, dx, dy) { n.setAttribute('transform', 'translate(' + dx.toFixed(2) + ',' + dy.toFixed(2) + ')'); }
function lerpInto(n, A, B, p) {   // A → B 보간을 n(=B의 복제)에 쓴다
  for (const a of NUM) {
    if (A.hasAttribute(a) && B.hasAttribute(a)) { const va = parseFloat(A.getAttribute(a)), vb = parseFloat(B.getAttribute(a)); if (!isNaN(va) && !isNaN(vb)) n.setAttribute(a, (va + (vb - va) * p).toFixed(2)); }
  }
  if (A.hasAttribute('points') && B.hasAttribute('points')) {
    const pa = pts(A), pb = pts(B);
    if (pa.length === pb.length) n.setAttribute('points', pb.map((q, j) => (pa[j][0] + (q[0] - pa[j][0]) * p).toFixed(1) + ',' + (pa[j][1] + (q[1] - pa[j][1]) * p).toFixed(1)).join(' '));
  }
  for (const a of ['fill', 'stroke']) if (A.getAttribute(a) && B.getAttribute(a)) n.setAttribute(a, mixC(A.getAttribute(a), B.getAttribute(a), p));
}
function grow(n, el, p, enter) {   // 새로 나타남
  const tag = el.tagName, e = ease(p);
  if (enter) { const [dx, dy] = enter.split(',').map(Number); n.setAttribute('transform', 'translate(' + (dx * (1 - e)).toFixed(1) + ',' + (dy * (1 - e)).toFixed(1) + ')'); n.style.opacity = Math.min(1, p * 2.5); return; }
  if ((tag === 'line' || tag === 'polyline' || (tag === 'polygon' && (el.getAttribute('fill') || 'none') === 'none')) && !el.getAttribute('stroke-dasharray')) {
    let len = 0; try { len = n.getTotalLength(); } catch (_) {}
    if (len > 0) { n.setAttribute('stroke-dasharray', len.toFixed(1)); n.setAttribute('stroke-dashoffset', (len * (1 - e)).toFixed(1)); n.style.opacity = Math.min(1, p * 4); return; }
  }
  if (tag === 'circle') { n.setAttribute('r', (parseFloat(el.getAttribute('r')) * e).toFixed(2)); n.style.opacity = Math.min(1, p * 2); return; }
  n.style.opacity = e;
}
function shrink(n, el, p, exit) {  // 사라짐
  const e = ease(p);
  if (exit) { const [dx, dy] = exit.split(',').map(Number); n.setAttribute('transform', 'translate(' + (dx * e).toFixed(1) + ',' + (dy * e).toFixed(1) + ')'); }
  n.style.opacity = 1 - e;
}

// ── 배경 흐름: data-flow 입자는 단계와 상관없이 계속 흐른다 ──
const FCACHE = new Map();
function drawFlow(it, op, tsec) {
  const [x, y, w, h, dx, dy, n, r, col, sp] = it.el.getAttribute('data-flow').split(',');
  const X = +x, Y = +y, W = +w, H = +h, DX = +dx, DY = +dy, N = +n, R = +r, SP = +sp || 40;
  let g = FCACHE.get(it.k); if (!g) { g = document.createElementNS(NS, 'g'); for (let i = 0; i < N; i++) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', R); c.setAttribute('fill', col); g.appendChild(c); } FCACHE.set(it.k, g); }
  const horiz = Math.abs(DX) >= Math.abs(DY), len = horiz ? W : H, t = REDUCE ? 0 : tsec;
  [...g.children].forEach((c, i) => {
    const off = (i * 0.61803) % 1, lane = ((i * 0.38197) % 1) * 0.84 + 0.08;
    let f = (off + t * SP / len) % 1; const sgn = horiz ? Math.sign(DX || 1) : Math.sign(DY || 1); if (sgn < 0) f = 1 - f;
    const px = horiz ? X + f * W : X + lane * W, py = horiz ? Y + lane * H : Y + f * H;
    c.setAttribute('cx', px.toFixed(1)); c.setAttribute('cy', py.toFixed(1)); c.style.opacity = (op * Math.sin(Math.PI * ((off + t * SP / len) % 1))).toFixed(2);
  });
  FL.appendChild(g);
}

// ── 장면 함수(선택): scene=<파일>.js 의 draw(p, t, api) ──
let SCENE = null;
if (SCENE_SRC) { try { SCENE = (new Function(SCENE_SRC + '\n;return typeof draw === "function" ? draw : null;'))(); } catch (e) { console.error(e); } }

// ── 한 프레임 그리기 ──
const TOTAL = () => S.length * D;
function frame(T, tsec) {
  T = clamp(T, 0, TOTAL() - 1);
  const i = Math.floor(T / D), u = T - i * D, praw = REDUCE ? 1 : clamp(u / (TR * D), 0, 1), p = ease(praw);
  while (L.firstChild) L.removeChild(L.firstChild); while (FL.firstChild) FL.removeChild(FL.firstChild);
  if (SCENE) { SCENE(T / TOTAL(), tsec, { svg: L, NS, step: i, local: u / D, change: praw, ease, lerp: (a, b, q) => a + (b - a) * q }); }
  else {
    const A = i > 0 ? STEPS[i - 1] : { items: [], map: new Map() }, B = STEPS[i], placed = new Map();
    for (const it of B.items) {
      if (isFlow(it.el)) { drawFlow(it, A.map.has(it.k) ? 1 : p, tsec); continue; }
      const a = A.map.get(it.k), n = node(i, it); reset(n); L.appendChild(n); placed.set(it.k, n);
      if (!a) { if (praw < 1) { if (isText(it.el) && !it.el.getAttribute('data-enter')) n.style.opacity = clamp(2 * praw - 1, 0, 1); else grow(n, it.el, praw, it.el.getAttribute('data-enter')); } continue; }
      if (praw >= 1) continue;
      if (it.k.endsWith('#bg')) {                                  // 글자 흰 바탕: 글자가 바뀌면 같이 교대, 같으면 같이 이동
        const ta = A.map.get(it.k.slice(0, -3)), tb = B.map.get(it.k.slice(0, -3));
        if (ta && tb && ta.el.textContent !== tb.el.textContent) {
          const o = node(i - 1, a); reset(o); L.insertBefore(o, n); o.style.opacity = clamp(1 - 2 * praw, 0, 1); n.style.opacity = clamp(2 * praw - 1, 0, 1); continue; }
      }
      if (isText(it.el)) {
        const [ax, ay] = anchor(a.el), [bx, by] = anchor(it.el);
        if (a.el.textContent === it.el.textContent) { moveText(n, (ax - bx) * (1 - p), (ay - by) * (1 - p)); lerpInto(n, a.el, it.el, p); }
        else {   // 글자가 바뀜: 앞 글자가 먼저 빠지고 새 글자가 들어온다(겹쳐 읽히지 않게)
          const o = node(i - 1, a); reset(o); L.insertBefore(o, n); moveText(o, (bx - ax) * p, (by - ay) * p); o.style.opacity = clamp(1 - 2 * praw, 0, 1);
          moveText(n, (ax - bx) * (1 - p), (ay - by) * (1 - p)); n.style.opacity = clamp(2 * praw - 1, 0, 1); }
      } else lerpInto(n, a.el, it.el, p);
    }
    let prevKey = null;                                           // 앞 단계에만 있는 물체 → 원래 쌓인 순서 그대로 끼워 넣고 사라지게
    for (const it of A.items) {
      if (B.map.has(it.k)) { prevKey = it.k; continue; }
      if (isFlow(it.el)) { if (praw < 1) drawFlow(it, 1 - p, tsec); continue; }
      if (praw >= 1) continue;
      const n = node(i - 1, it); reset(n);
      const anchorN = prevKey ? placed.get(prevKey) : null;
      if (anchorN && anchorN.parentNode === L) L.insertBefore(n, anchorN.nextSibling); else L.insertBefore(n, L.firstChild);
      placed.set(it.k, n); prevKey = it.k;
      if (isText(it.el)) n.style.opacity = clamp(1 - 2 * praw, 0, 1); else shrink(n, it.el, praw, it.el.getAttribute('data-exit'));
      if (isText(it.el) && it.el.getAttribute('data-exit')) shrink(n, it.el, praw, it.el.getAttribute('data-exit'));
    }
  }
  xm.style.opacity = S[i].wrong ? (0.2 + 0.8 * praw).toFixed(2) : 0;
  return { i, u };
}

// ── 설명 4줄: 머무는 구간에서 한 줄씩(지금 줄 굵게 · 지난 줄 흐리게) ──
let lastI = -1;
function caption(i, u) {
  const s = S[i];
  if (i !== lastI) {
    const row = (k, v, j) => v ? `<div class="ln fut" data-j="${j}"><span class="k">· ${k}:</span> ${v}</div>` : '';
    cap.innerHTML = `<div class="t"><span class="n">[${s.n}단계]</span> ${s.wrong ? '<span class="w">✕ 틀린 해석</span> ' : ''}${s.title}</div>`
      + `<div class="meta">${s.part}${s.order ? ' · ' + s.order : ''}</div>`
      + row('이건 뭐야', s.what, 0) + row('왜 필요해', s.why, 1) + row('앞 단계 → 이 단계', s.flow, 2) + row('다음 단계 질문', s.next, 3);
    [...dots.children].forEach((b, j) => b.classList.toggle('on', j === i)); cnt.textContent = `${i + 1} / ${S.length}단계`; lastI = i;
  }
  const hold = (u - TR * D) / ((1 - TR) * D), shown = REDUCE ? 4 : (hold < 0 ? 0 : Math.min(4, Math.floor(hold * 4.6) + 1));
  cap.querySelectorAll('.ln').forEach(el => { const j = +el.dataset.j; el.className = 'ln ' + (j >= shown ? 'fut' : (j === shown - 1 ? 'cur' : 'past')); });
}

// ── 재생 · 시간 축 ──
let T = 0, playing = true, speed = 1, last = performance.now(), dragging = false;
function tick(now) {
  const dt = Math.min(100, now - last); last = now;
  if (playing && !dragging) { T += dt * speed; if (T >= TOTAL()) T = 0; }
  const { i, u } = frame(T, now / 1000); caption(i, u);
  if (!dragging) slider.value = Math.round(T / TOTAL() * 1000);
  requestAnimationFrame(tick);
}
function setPlay(v) { playing = v; playBtn.textContent = v ? '❚❚ 멈춤' : '▶ 재생'; }
function jump(i) { T = clamp(i, 0, S.length - 1) * D; }
playBtn.onclick = () => setPlay(!playing);
$('prev').onclick = () => { const i = Math.floor(T / D); jump(T - i * D > TR * D ? i : i - 1); setPlay(false); };
$('next').onclick = () => { jump(Math.floor(T / D) + 1); setPlay(false); };
slider.addEventListener('input', () => { dragging = true; setPlay(false); T = slider.value / 1000 * (TOTAL() - 1); });
slider.addEventListener('change', () => { dragging = false; });
document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x === b)); });
S.forEach((s, k) => { const b = document.createElement('button'); b.textContent = s.n; if (s.wrong) b.classList.add('wr'); b.onclick = () => { jump(k); setPlay(true); }; dots.appendChild(b); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); if (e.key === ' ') { e.preventDefault(); setPlay(!playing); } });
let x0 = null; const st = $('stage');
st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
st.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) (dx < 0 ? $('next') : $('prev')).click(); x0 = null; });
window.__anim = { seek: t => { T = t; setPlay(false); }, D, TR, N: S.length };   // 검수용(특정 시각 화면 찍기)
requestAnimationFrame(tick);
})();
</script></body></html>
