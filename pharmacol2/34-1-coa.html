gth=\"424.3\" lengthAdjust=\"spacingAndGlyphs\">혈장에 시약을 넣고 굳기까지 걸린 시간을 막대로 옮긴다<\/tspan><\/text><\/svg>", "what": "환자 혈장을 시험관에 담고 시약을 넣어 굳을 때까지 시간을 잰다. 그 시간을 막대 길이로 옮긴다.", "why": "몸속에서 보이지 않는 연쇄반응을 ‘시간’ 하나로 바꿔야 정상과 비교할 수 있다.", "flow": "혈장 + 시약 → 굳기까지 걸린 시간 → 막대", "next": "어떤 시약을 넣느냐에 따라 무엇이 달라질까?"}, {"n": "10", "part": "2부 축 · 기호", "order": "—", "title": "두 시계, PT와 PTT", "wrong": false, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 450\" width=\"800\" height=\"450\"><rect x=\"0\" y=\"0\" width=\"800\" height=\"450\" fill=\"#FFFFFF\"/><defs><marker id=\"ah1\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L10,4 L0,8 z\" fill=\"#222222\"/><\/marker><\/defs><line data-k=\"g.x\" x1=\"260.0\" y1=\"300.0\" x2=\"730.0\" y2=\"300.0\" stroke=\"#222222\" stroke-width=\"2\" marker-end=\"url(#ah1)\"/><line data-k=\"g.y\" x1=\"260.0\" y1=\"300.0\" x2=\"260.0\" y2=\"80.0\" stroke=\"#222222\" stroke-width=\"2\"/><text data-k=\"g.xl\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#666666\" text-anchor=\"end\"><tspan x=\"730.0\" y=\"325.0\" textLength=\"208.8\" lengthAdjust=\"spacingAndGlyphs\">굳기까지 걸린 시간(상대값 · 모식도)<\/tspan><\/text><rect data-k=\"pt0\" x=\"260.0\" y=\"110.0\" width=\"150.4\" height=\"28.0\" rx=\"0\" fill=\"#BBBBBB\" stroke=\"#222222\" stroke-width=\"1\"/><text data-k=\"pt0.t\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#222222\" text-anchor=\"end\" font-weight=\"700\"><tspan x=\"252.0\" y=\"129.0\" textLength=\"17.2\" lengthAdjust=\"spacingAndGlyphs\">PT<\/tspan><\/text><rect data-k=\"ptt0\" x=\"260.0\" y=\"156.0\" width=\"188.0\" height=\"28.0\" rx=\"0\" fill=\"#BBBBBB\" stroke=\"#222222\" stroke-width=\"1\"/><text data-k=\"ptt0.t\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#222222\" text-anchor=\"end\" font-weight=\"700\"><tspan x=\"252.0\" y=\"175.0\" textLength=\"25.7\" lengthAdjust=\"spacingAndGlyphs\">PTT<\/tspan><\/text><text data-k=\"def1\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#222222\" text-anchor=\"start\"><tspan x=\"266.0\" y=\"230.0\" textLength=\"405.5\" lengthAdjust=\"spacingAndGlyphs\">PT = 조직인자 + Ca²⁺ → 외인성(VII) + 공통(X · V · II · fibrinogen)<\/tspan><\/text><text data-k=\"def2\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#222222\" text-anchor=\"start\"><tspan x=\"266.0\" y=\"256.0\" textLength=\"371.2\" lengthAdjust=\"spacingAndGlyphs\">PTT = 접촉인자 + Ca²⁺ → 내인성(XII · XI · IX · VIII) + 공통<\/tspan><\/text><text data-k=\"leg\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"14\" fill=\"#666666\" text-anchor=\"end\" font-weight=\"700\"><tspan x=\"730.0\" y=\"70.0\" textLength=\"118.4\" lengthAdjust=\"spacingAndGlyphs\">회색 막대 = 정상인<\/tspan><\/text><text data-k=\"status\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"17\" fill=\"#222222\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"400.0\" y=\"380.0\" textLength=\"459.0\" lengthAdjust=\"spacingAndGlyphs\">두 시계 — PT는 외인성, PTT는 내인성 경로를 잰다(그림 S7)<\/tspan><\/text><\/svg>", "what": "회색 막대 두 개가 정상인의 PT와 PTT다. PT는 조직인자와 Ca²⁺를 넣어 외인성 경로(VII)와 공통 경로를 재고, PTT는 접촉인자로 시작해 내인성 경로(XII · XI · IX · VIII)와 공통 경로를 잰다.", "why": "어느 시계가 늦는지 보면 어느 경로의 인자가 빠졌는지 안다.", "flow": "막대 = 시간 → PT(외인성) · PTT(내인성) 두 줄", "next": "warfarin을 먹은 환자는 어느 막대가 길어질까?"}, {"n": "11", "part": "3부 원리", "order": "—", "title": "warfarin은 PT를 늘린다", "wrong": false, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 450\" width=\"800\" height=\"450\"><rect x=\"0\" y=\"0\" width=\"800\" height=\"450\" fill=\"#FFFFFF\"/><defs><marker id=\"ah1\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L10,4 L0,8 z\" fill=\"#222222\"/><\/marker><\/defs><line data-k=\"g.x\" x1=\"260.0\" y1=\"300.0\" x2=\"730.0\" y2=\"300.0\" stroke=\"#222222\" stroke- rfarin → 비타민 K 의존 인자(II · VII · IX · X) 합성↓<\/tspan><\/text><text data-k=\"def2\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#D62828\" text-anchor=\"start\" font-weight=\"700\"><tspan x=\"266.0\" y=\"256.0\" textLength=\"302.4\" lengthAdjust=\"spacingAndGlyphs\">반감기가 짧은 VII이 먼저 줄어 PT가 먼저 길어진다<\/tspan><\/text><text data-k=\"status\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"17\" fill=\"#D62828\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"400.0\" y=\"380.0\" textLength=\"356.8\" lengthAdjust=\"spacingAndGlyphs\">warfarin은 PT(prothrombin time)로 조절한다<\/tspan><\/text><\/svg>", "what": "warfarin 환자(파랑)의 PT 막대가 크게 길어졌다. warfarin은 비타민 K 의존 인자(II · VII · IX · X)의 합성을 막는데, 그중 반감기가 가장 짧은 VII이 먼저 줄기 때문이다.", "why": "그래서 warfarin 용량은 prothrombin time(PT)으로 조절한다.", "flow": "warfarin → VII 먼저 감소 → 외인성 경로 느림 → PT↑", "next": "heparin은 어느 막대를 늘릴까?"}, {"n": "12", "part": "3부 원리", "order": "—", "title": "heparin은 PTT를 늘린다", "wrong": false, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 450\" width=\"800\" height=\"450\"><rect x=\"0\" y=\"0\" width=\"800\" height=\"450\" fill=\"#FFFFFF\"/><defs><marker id=\"ah1\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L10,4 L0,8 z\" fill=\"#222222\"/><\/marker><\/defs><line data-k=\"g.x\" x1=\"260.0\" y1=\"300.0\" x2=\"730.0\" y2=\"300.0\" stroke=\"#222222\" stroke-width=\"2\" marker-end=\"url(#ah1)\"/><line data-k=\"g.y\" x1=\"260.0\" y1=\"300.0\" x2=\"260.0\" y2=\"80.0\" stroke=\"#222222\" stroke-width=\"2\"/><text data-k=\"g.xl\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#666666\" text-anchor=\"end\"><tspan x=\"730.0\" y=\"325.0\" textLength=\"208.8\" lengthAdjust=\"spacingAndGlyphs\">굳기까지 걸린 시간(상대값 · 모식도)<\/tspan><\/text><rect data-k=\"pt0\" x=\"260.0\" y=\"110.0\" width=\"150.4\" height=\"28.0\" rx=\"0\" fill=\"#BBBBBB\" stroke=\"#222222\" stroke-width=\"1\"/ \"419.9\" lengthAdjust=\"spacingAndGlyphs\">heparin은 PTT(partial thromboplastin time)로 본다<\/tspan><\/text><\/svg>", "what": "heparin 환자(파랑)의 PTT 막대가 크게 길어졌다. heparin은 antithrombin III를 도와 thrombin과 Xa를 끈다.", "why": "슬라이드도 heparin의 출혈 독성은 PTT로 검토하라고 한다.", "flow": "heparin → thrombin · Xa 억제 → PTT↑", "next": "같은 warfarin이라도 먹은 날짜에 따라 막대가 같을까?"}, {"n": "13", "part": "4부 시간", "order": "첫날 → 4일째", "title": "첫날(실선)과 4일째(점선)", "wrong": false, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 450\" width=\"800\" height=\"450\"><rect x=\"0\" y=\"0\" width=\"800\" height=\"450\" fill=\"#FFFFFF\"/><defs><marker id=\"ah1\" markerWidth=\"10\" markerHeight=\"8\" refX=\"9\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L10,4 L0,8 z\" fill=\"#222222\"/><\/marker><\/defs><line data-k=\"g.x\" x1=\"260.0\" y1=\"300.0\" x2=\"730.0\" y2=\"300.0\" stroke=\"#222222\" stroke-width=\"2\" marker-end=\"url(#ah1)\"/><line data-k=\"g.y\" x1=\"260.0\" y1=\"300.0\" x2=\"260.0\" y2=\"80.0\" stroke=\"#222222\" stroke-width=\"2\"/><text data-k=\"g.xl\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#666666\" text-anchor=\"end\"><tspan x=\"730.0\" y=\"325.0\" textLength=\"208.8\" lengthAdjust=\"spacingAndGlyphs\">굳기까지 걸린 시간(상대값 · 모식도)<\/tspan><\/text><rect data-k=\"pt0\" x=\"260.0\" y=\"110.0\" width=\"150.4\" height=\"28.0\" rx=\"0\" fill=\"#BBBBBB\" stroke=\"#222222\" stroke-width=\"1\"/><text data-k=\"pt0.t\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#222222\" text-anchor=\"end\" font-weight=\"700\"><tspan x=\"252.0\" y=\"129.0\" textLength=\"17.2\" lengthAdjust=\"spacingAndGlyphs\">PT<\/tspan><\/text><rect data-k=\"ptt0\" x=\"260.0\" y=\"156.0\" width=\"188.0\" height=\"28.0\" rx=\"0\" fill=\"#BBBBBB\" stroke=\"#222222\" stroke-width=\"1\"/><text data-k=\"ptt0.t\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#222222\" text-anchor=\"end\" font-weight=\"700\"><tspan x=\"252.0\" y=\"175.0\" textLength=\"25.7\" lengthAdjust=\"spacingAndGlyphs\">PTT<\/tspan><\/text><rect data-k=\"pt1\" x=\"260.0\" y=\"124.0\" width=\"159.8\" height=\"12.0\" rx=\"0\" fill=\"#3B7DD8\" stroke=\"#222222\" stroke-width=\"1\"/><rect data-k=\"pt2\" x=\"260.0\" y=\"120.0\" width=\"329.0\" height=\"20.0\" rx=\"0\" fill=\"none\" stroke=\"#D62828\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/><rect data-k=\"ptt1\" x=\"260.0\" y=\"170.0\" width=\"197.4\" height=\"12.0\" rx=\"0\" fill=\"#3B7DD8\" stroke=\"#222222\" stroke-width=\"1\"/><text data-k=\"leg\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"14\" fill=\"#222222\" text-anchor=\"end\" font-weight=\"700\"><tspan x=\"730.0\" y=\"70.0\" textLength=\"223.7\" lengthAdjust=\"spacingAndGlyphs\">warfarin 첫날(실선) vs 4일째(점선)<\/tspan><\/text><text data-k=\"def1\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#222222\" text-anchor=\"start\"><tspan x=\"266.0\" y=\"230.0\" textLength=\"322.9\" lengthAdjust=\"spacingAndGlyphs\">첫날은 PT가 거의 그대로 — 이미 만든 인자가 남아 있다<\/tspan><\/text><text data-k=\"def2\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"13\" fill=\"#D62828\" text-anchor=\"start\" font-weight=\"700\"><tspan x=\"266.0\" y=\"256.0\" textLength=\"192.1\" lengthAdjust=\"spacingAndGlyphs\">며칠 지나야 길어진다(34-4 연재)<\/tspan><\/text><text data-k=\"status\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"17\" fill=\"#222222\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"400.0\" y=\"380.0\" textLength=\"267.2\" lengthAdjust=\"spacingAndGlyphs\">같은 약도 날짜에 따라 PT가 다르다<\/tspan><\/text><text data-k=\"sub\" font-family=\"Noto Sans CJK KR, Noto Sans KR, sans-serif\" font-size=\"14\" fill=\"#666666\" text-anchor=\"middle\"><tspan x=\"400.0\" y=\"410.0\" textLength=\"119.8\" lengthAdjust=\"spacingAndGlyphs\">막대 길이는 모식도<\/tspan><\/text><\/svg>", "what": "warfarin 첫날의 PT(실선 파랑)는 정상과 거의 같고, 4일째(빨간 점선)에는 크게 길어졌다.", "why": "이미 만들       if (isText(it.el)) {
        const [ax, ay] = anchor(a.el), [bx, by] = anchor(it.el);
        if (a.el.textContent === it.el.textContent) { moveText(n, (ax - bx) * (1 - p), (ay - by) * (1 - p)); lerpInto(n, a.el, it.el, p); }
        else {   // 글자가 바뀜: 앞 글자가 먼저 빠지고 새 글자가 들어온다(겹쳐 읽히지 않게)
          const o = node(i - 1, a); reset(o); L.insertBefore(o, n); moveText(o, (bx - ax) * p, (by - ay) * p); o.style.opacity = clamp(1 - 2 * praw, 0, 1);
          moveText(n, (ax - bx) * (1 - p), (ay - by) * (1 - p)); n.style.opacity = clamp(2 * praw - 1, 0, 1); }
      } else lerpInto(n, a.el, it.el, p);
    }
    let prevKey = null;                                           // 앞 단계에만 있는 물체 → 원래 쌓인 순서 그대로 끼워 넣고 사라지게
    for (const it of A.items) {
      if (B.map.has(it.k)) { prevKey = it.k; continue; }
      if (isFlow(it.el)) { if (praw < 1) drawFlow(it, 1 - p, tsec); continue; }
      if (praw >= 1) continue;
      const n = node(i - 1, it); reset(n);
      const anchorN = prevKey ? placed.get(prevKey) : null;
      if (anchorN && anchorN.parentNode === L) L.insertBefore(n, anchorN.nextSibling); else L.insertBefore(n, L.firstChild);
      placed.set(it.k, n); prevKey = it.k;
      if (isText(it.el)) n.style.opacity = clamp(1 - 2 * praw, 0, 1); else shrink(n, it.el, praw, it.el.getAttribute('data-exit'));
      if (isText(it.el) && it.el.getAttribute('data-exit')) shrink(n, it.el, praw, it.el.getAttribute('data-exit'));
    }
  }
  xm.style.opacity = S[i].wrong ? (0.2 + 0.8 * praw).toFixed(2) : 0;
  return { i, u };
}

// ── 설명 4줄: 머무는 구간에서 한 줄씩(지금 줄 굵게 · 지난 줄 흐리게) ──
let lastI = -1;
function caption(i, u) {
  const s = S[i];
  if (i !== lastI) {
    const row = (k, v, j) => v ? `<div class="ln fut" data-j="${j}"><span class="k">· ${k}:</span> ${v}</div>` : '';
    cap.innerHTML = `<div class="t"><span class="n">[${s.n}단계]</span> ${s.wrong ? '<span class="w">✕ 틀린 해석</span> ' : ''}${s.title}</div>`
      + `<div class="meta">${s.part}${s.order ? ' · ' + s.order : ''}</div>`
      + row('이건 뭐야', s.what, 0) + row('왜 필요해', s.why, 1) + row('앞 단계 → 이 단계', s.flow, 2) + row('다음 단계 질문', s.next, 3);
    [...dots.children].forEach((b, j) => b.classList.toggle('on', j === i)); cnt.textContent = `${i + 1} / ${S.length}단계`; lastI = i;
  }
  const hold = (u - TR * D) / ((1 - TR) * D), shown = REDUCE ? 4 : (hold < 0 ? 0 : Math.min(4, Math.floor(hold * 4.6) + 1));
  cap.querySelectorAll('.ln').forEach(el => { const j = +el.dataset.j; el.className = 'ln ' + (j >= shown ? 'fut' : (j === shown - 1 ? 'cur' : 'past')); });
}

// ── 재생 · 시간 축 ──
let T = 0, playing = true, speed = 1, last = performance.now(), dragging = false;
function tick(now) {
  const dt = Math.min(100, now - last); last = now;
  if (playing && !dragging) { T += dt * speed; if (T >= TOTAL()) T = 0; }
  const { i, u } = frame(T, now / 1000); caption(i, u);
  if (!dragging) slider.value = Math.round(T / TOTAL() * 1000);
  requestAnimationFrame(tick);
}
function setPlay(v) { playing = v; playBtn.textContent = v ? '❚❚ 멈춤' : '▶ 재생'; }
function jump(i) { T = clamp(i, 0, S.length - 1) * D; }
playBtn.onclick = () => setPlay(!playing);
$('prev').onclick = () => { const i = Math.floor(T / D); jump(T - i * D > TR * D ? i : i - 1); setPlay(false); };
$('next').onclick = () => { jump(Math.floor(T / D) + 1); setPlay(false); };
slider.addEventListener('input', () => { dragging = true; setPlay(false); T = slider.value / 1000 * (TOTAL() - 1); });
slider.addEventListener('change', () => { dragging = false; });
document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x === b)); });
S.forEach((s, k) => { const b = document.createElement('button'); b.textContent = s.n; if (s.wrong) b.classList.add('wr'); b.onclick = () => { jump(k); setPlay(true); }; dots.appendChild(b); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); if (e.key === ' ') { e.preventDefault(); setPlay(!playing); } });
let x0 = null; const st = $('stage');
st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
st.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) (dx < 0 ? $('next') : $('prev')).click(); x0 = null; });
window.__anim = { seek: t => { T = t; setPlay(false); }, D, TR, N: S.length };   // 검수용(특정 시각 화면 찍기)
requestAnimationFrame(tick);
})();
</script></body></html>
