  return { i, u };
}

// ── 설명 4줄: 머무는 구간에서 한 줄씩(지금 줄 굵게 · 지난 줄 흐리게) ──
let lastI = -1;
function caption(i, u) {
  const s = S[i];
  if (i !== lastI) {
    const row = (k, v, j) => v ? `<div class="ln fut" data-j="${j}"><span class="k">· ${k}:</span> ${v}</div>` : '';
    cap.innerHTML = `<div class="t"><span class="n">[${s.n}단계]</span> ${s.wrong ? '<span class="w">✕ 틀린 해석</span> ' : ''}${s.title}</div>`
      + `<div class="meta">${s.part}${s.order ? ' · ' + s.order : ''}</div>`
      + row('이건 뭐야', s.what, 0) + row('왜 필요해', s.why, 1) + row('앞 단계 → 이 단계', s.flow, 2) + row('다음 단계 질문', s.next, 3);
    [...dots.children].forEach((b, j) => b.classList.toggle('on', j === i)); cnt.textContent = `${i + 1} / ${S.length}단계`; lastI = i;
  }
  const hold = (u - TR * D) / ((1 - TR) * D), shown = REDUCE ? 4 : (hold < 0 ? 0 : Math.min(4, Math.floor(hold * 4.6) + 1));
  cap.querySelectorAll('.ln').forEach(el => { const j = +el.dataset.j; el.className = 'ln ' + (j >= shown ? 'fut' : (j === shown - 1 ? 'cur' : 'past')); });
}

// ── 재생 · 시간 축 ──
let T = 0, playing = true, speed = 1, last = performance.now(), dragging = false;
function tick(now) {
  const dt = Math.min(100, now - last); last = now;
  if (playing && !dragging) { T += dt * speed; if (T >= TOTAL()) T = 0; }
  const { i, u } = frame(T, now / 1000); caption(i, u);
  if (!dragging) slider.value = Math.round(T / TOTAL() * 1000);
  requestAnimationFrame(tick);
}
function setPlay(v) { playing = v; playBtn.textContent = v ? '❚❚ 멈춤' : '▶ 재생'; }
function jump(i) { T = clamp(i, 0, S.length - 1) * D; }
playBtn.onclick = () => setPlay(!playing);
$('prev').onclick = () => { const i = Math.floor(T / D); jump(T - i * D > TR * D ? i : i - 1); setPlay(false); };
$('next').onclick = () => { jump(Math.floor(T / D) + 1); setPlay(false); };
slider.addEventListener('input', () => { dragging = true; setPlay(false); T = slider.value / 1000 * (TOTAL() - 1); });
slider.addEventListener('change', () => { dragging = false; });
document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x === b)); });
S.forEach((s, k) => { const b = document.createElement('button'); b.textContent = s.n; if (s.wrong) b.classList.add('wr'); b.onclick = () => { jump(k); setPlay(true); }; dots.appendChild(b); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); if (e.key === ' ') { e.preventDefault(); setPlay(!playing); } });
let x0 = null; const st = $('stage');
st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
st.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) (dx < 0 ? $('next') : $('prev')).click(); x0 = null; });
window.__anim = { seek: t => { T = t; setPlay(false); }, D, TR, N: S.length };   // 검수용(특정 시각 화면 찍기)
requestAnimationFrame(tick);
})();
</script></body></html>
