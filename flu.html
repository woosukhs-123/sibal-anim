const stage = document.getElementById('stage'), cap = document.getElementById('cap'), slider = document.getElementById('slider');
const cnt = document.getElementById('cnt'), playBtn = document.getElementById('play'), dots = document.getElementById('dots');
const imgs = S.map((s, k) => { const im = new Image(); im.src = s.img; im.alt = s.n + '단계'; stage.appendChild(im); return im; });
S.forEach((s, k) => { const b = document.createElement('button'); b.textContent = s.n; if (s.wrong) b.classList.add('wr'); b.onclick = () => { go(k); stop(); }; dots.appendChild(b); });
let cur = 0, timer = null, ms = 3200;
function row(k, v) { return v ? `<div><span class="k">· ${k}:</span> ${v}</div>` : ''; }
function go(k) {
  cur = (k + S.length) % S.length; const s = S[cur];
  imgs.forEach((im, i) => im.classList.toggle('on', i === cur));
  stage.classList.toggle('wrong', !!s.wrong);
  cap.innerHTML = `<div class="t"><span class="n">[${s.n}단계]</span> ${s.wrong ? '<span class="w">✕ 틀린 해석</span> ' : ''}${s.title}</div>`
    + `<div class="meta">${s.part}${s.order ? ' · ' + s.order : ''}</div>`
    + row('이건 뭐야', s.what) + row('왜 필요해', s.why) + row('앞 단계 → 이 단계', s.flow) + row('다음 단계 질문', s.next);
  slider.value = cur + 1; cnt.textContent = `${cur + 1} / ${S.length}단계`;
  [...dots.children].forEach((b, i) => b.classList.toggle('on', i === cur));
}
function play() { stop(); timer = setInterval(() => go(cur + 1), ms); playBtn.textContent = '❚❚ 멈춤'; }
function stop() { if (timer) clearInterval(timer); timer = null; playBtn.textContent = '▶ 재생'; }

document.getElementById('prev').onclick = () => { go(cur - 1); stop(); };
document.getElementById('next').onclick = () => { go(cur + 1); stop(); };
slider.oninput = () => { go(slider.value - 1); stop(); };
document.querySelectorAll('[data-ms]').forEach(b => b.onclick = () => { ms = +b.dataset.ms; if (timer) play(); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { go(cur + 1); stop(); } if (e.key === 'ArrowLeft') { go(cur - 1); stop(); } if (e.key === ' ') { e.preventDefault(); timer ? stop() : play(); } });

stage.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { go(cur + (dx < 0 ? 1 : -1)); stop(); } x0 = null; });
